name: Build and Release Electron App

on:
  # 本地打 Tag 并推送时自动触发（如 git push origin v1.0.2）
  push:
    tags:
      - 'v*'
      - 'V*'
  # 在 GitHub 网页 Actions 页面手动点击 Run workflow 触发
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例 v1.0.2）'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # 解压本地 ffmpeg.zip
      - name: Extract local ffmpeg.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Expand-Archive -Path bin/ffmpeg.zip -DestinationPath bin/tmp -Force
          $exe = Get-ChildItem -Path bin/tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination bin/ffmpeg.exe -Force
          Remove-Item -Recurse -Force bin/tmp
          Remove-Item -Force bin/ffmpeg.zip

      # 构建 Windows 安装包
      - name: Build Windows package
        run: npm run build:win

      # 从 CHANGELOG.md 中提取当前发布版本内容
      - name: Extract Current Version Notes
        shell: node {0}
        env:
          CURRENT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          const fs = require('fs');
          if (!fs.existsSync('CHANGELOG.md')) {
            fs.writeFileSync('CURRENT_RELEASE_NOTES.md', '常规更新与优化');
            process.exit(0);
          }
          const content = fs.readFileSync('CHANGELOG.md', 'utf8');
          const version = process.env.CURRENT_VERSION.replace(/^[vV]/, '').trim();
          
          // 正则匹配：只提取当前 ## 版本的说明，遇到下一个 ## 就停止
          const regex = new RegExp(`##\\s*\\[?[vV]?${version}\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n##|$)`, 'i');
          const match = content.match(regex);
          
          const notes = (match && match[1]) ? match[1].trim() : `Release ${process.env.CURRENT_VERSION}`;
          fs.writeFileSync('CURRENT_RELEASE_NOTES.md', notes);
          console.log('--- 成功提取当前版本内容 ---');
          console.log(notes);

      # 发布 Release 并仅包含当前版本的说明
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "Video Handle ${{ inputs.version || github.ref_name }}"
          body_path: CURRENT_RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}