name: Build and Release Electron App

on:
  # 模式 1：本地推送以 'v' 开头的 tag 时自动触发（如 v1.0.2）
  push:
    tags:
      - 'v*'
  # 模式 2：保留网页端手动触发选项（备用）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.0.2）'
        required: true
        default: 'v1.0.2'
      release_notes:
        description: '手动输入的更新说明（选填）'
        required: false
        default: '常规更新与 Bug 修复'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # fetch-depth: 0 保证拉取完整的 Git 历史和 Tag 信息
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Extract local ffmpeg.zip
        shell: pwsh
        run: |
          Expand-Archive -Path bin/ffmpeg.zip -DestinationPath bin/tmp -Force
          $exe = Get-ChildItem -Path bin/tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination bin/ffmpeg.exe -Force
          Remove-Item -Recurse -Force bin/tmp
          Remove-Item -Force bin/ffmpeg.zip

      - name: Build Windows package
        run: npm run build:win

      # 关键步骤：解析版本号和本地写入的更新说明
      - name: Parse Tag and Release Notes
        id: release_info
        shell: pwsh
        run: |
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.version }}
          name: "Video Handle ${{ steps.release_info.outputs.version }}"
          body: ${{ steps.release_info.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
