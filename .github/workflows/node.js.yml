name: Build and Release Electron App

on:
  # 本地打 Tag 并推送时自动触发（如 git push origin v1.0.2）
  push:
    tags:
      - 'v*'
      - 'V*'
  # 在 GitHub 网页 Actions 页面手动点击 Run workflow 触发
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例 v1.0.2）'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Extract local ffmpeg.zip
        shell: pwsh
        run: |

      - name: Build Windows package
        run: npm run build:win

      # 从 CHANGELOG.md 中提取当前发布版本内容
      - name: Extract Current Version Notes
        shell: node {0}
        env:
          CURRENT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |

      # 发布 Release 并仅包含当前版本的说明
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "Video Handle ${{ inputs.version || github.ref_name }}"
          # 只读取切出来的当前版本日志
          body_path: CURRENT_RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}