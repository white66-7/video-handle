name: Build and Release Electron App

on:
  # 本地打 Tag 推送时触发（如 git push origin v1.0.2）
  push:
    tags:
      - 'v*'
  # 网页端手动点击 Run workflow 触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 v1.0.2）'
        required: true
        default: 'v1.0.2'
      release_notes:
        description: '更新说明日志（选填）'
        required: false
        default: '常规更新与 Bug 修复'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract local ffmpeg.zip
        shell: pwsh
        run: |
          Expand-Archive -Path bin/ffmpeg.zip -DestinationPath bin/tmp -Force
          $exe = Get-ChildItem -Path bin/tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination bin/ffmpeg.exe -Force
          Remove-Item -Recurse -Force bin/tmp
          Remove-Item -Force bin/ffmpeg.zip
          Get-ChildItem bin

      - name: Build Windows package
        run: npm run build:win
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          # 如果是手动点击取 inputs.version，如果是推 Tag 自动取 Tag 名（如 v1.0.2）
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "Video Handle ${{ inputs.version || github.ref_name }}"
          body: ${{ inputs.release_notes }}
          # 自动汇总生成更新日志（包含本次发布的所有 commit 说明）
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
