name: Build and Release Electron App

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号,例:v1.0.0'
        required: true
        default: 'v1.0.1'

# 赋予创建 Release 和上传附件的写入权限
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 解压本地特定版本的 ffmpeg.zip，并清理 zip 文件避免安装包体积过大
      - name: Extract local ffmpeg.zip
        shell: pwsh
        run: |
          Expand-Archive -Path bin/ffmpeg.zip -DestinationPath bin/tmp -Force
          $exe = Get-ChildItem -Path bin/tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination bin/ffmpeg.exe -Force
          Remove-Item -Recurse -Force bin/tmp
          Remove-Item -Force bin/ffmpeg.zip
          Get-ChildItem bin

      # 构建 Windows 安装包
      - name: Build Windows package
        run: npm run build:win

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
